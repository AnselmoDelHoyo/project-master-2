<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM — Ejercicio 4: eventos</title>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Eventos del DOM</h1>

    <section>
      <h2>1.1 — Evento click</h2>
      <button id="btnToClick" type="button">Haz clic aquí</button>
    </section>

    <section>
      <h2>1.2 — Evento focus</h2>
      <label for="focus-input">Haz clic dentro de este campo:</label>
      <input class="focus" id="focus-input" type="text" value="Valor inicial">
    </section>

    <section>
      <h2>1.3 — Evento input</h2>
      <label for="value-input">Escribe para ver el valor en la consola:</label>
      <input class="value" id="value-input" type="text" placeholder="Escribe aquí">
    </section>

    <p>Abre la consola del navegador (F12 → Console) para ver los resultados.</p>
  </main>
</body>
</html>
